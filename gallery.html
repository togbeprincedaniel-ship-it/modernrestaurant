<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery | La Maison</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">
        <div class="container nav-content">

            <a href="index.html" class="logo">
                La Maison
            </a>

            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="gallery.html" class="active">Gallery</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>

            <a href="menu.html" class="nav-button">
                View Menu
            </a>

        </div>
    </header>


    <!-- Page Hero -->
    <section class="page-hero">

        <div class="container">

            <p class="small-title">
                OUR GALLERY
            </p>

            <h1>
                A glimpse of our restaurant.
            </h1>

            <p>
                Discover our dishes, atmosphere and beautiful moments.
            </p>

        </div>

    </section>


    <!-- Gallery -->
    <main>

        <section class="gallery-section">

            <div class="container">

                <div class="gallery-grid">

                    <div class="gallery-item">
                        <img
                            src="gallery-1.jpg"
                            alt="Restaurant dish"
                        >
                    </div>

                    <div class="gallery-item">
                        <img
                            src="gallery-2.jpg"
                            alt="Restaurant interior"
                        >
                    </div>

                    <div class="gallery-item">
                        <img
                            src="gallery-3.jpg"
                            alt="Fresh pizza"
                        >
                    </div>

                    <div class="gallery-item">
                        <img
                            src="gallery-4.jpg"
                            alt="Fresh salad"
                        >
                    </div>

                    <div class="gallery-item">
                        <img
                            src="gallery-5.jpg"
                            alt="Restaurant table"
                        >
                    </div>

                    <div class="gallery-item">
                        <img
                            src="gallery-6.jpg"
                            alt="Restaurant dessert"
                        >
                    </div>

                </div>

            </div>

        </section>


        <!-- CTA -->
        <section class="cta">

            <div class="container cta-content">

                <div>

                    <p class="small-title">
                        LIKE WHAT YOU SEE?
                    </p>

                    <h2>
                        Come visit us.
                    </h2>

                </div>

                <a href="contact.html" class="btn primary-btn">
                    Contact Us
                </a>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <div class="container footer-content">

            <p>
                © 2026 La Maison. All rights reserved.
            </p>

            <p>
                Modern Restaurant Website Template
            </p>

        </div>

    </footer>


    <script src="script.js"></script>

</body>
</html>
